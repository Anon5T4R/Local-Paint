[package]
name = "localpaint-io"
description = "Import/export between localpaint documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to localpaint-codecs; see its `heif` feature).
heif = ["localpaint-codecs/heif"]

[dependencies]
localpaint-geom = { workspace = true }
localpaint-color = { workspace = true }
localpaint-cms = { workspace = true }
localpaint-raster = { workspace = true }
localpaint-doc = { workspace = true }
localpaint-compose = { workspace = true }
localpaint-algo = { workspace = true }
localpaint-psd = { workspace = true }
localpaint-codecs = { workspace = true }
localpaint-raw = { workspace = true }
localpaint-affinity = { workspace = true }
localpaint-text = { workspace = true }
localpaint-paint = { workspace = true }
localpaint-vector = { workspace = true }
localpaint-format = { path = "../format" }
craft-docpath = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# svg.rs inflates `.svgz` itself (with a size cap) so the XML can be checked before it is parsed;
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
# ora.rs reads OpenRaster's stack.xml (already in the tree through usvg).
roxmltree = "0.21"
# Reuse usvg's locked header reader to bound embedded SVG raster data before decoding.
imagesize = "0.13"
# SVG import (svg.rs): usvg parses, resvg rasterises what the shape model can't hold. Both are
# already in the tree through the UI's icon loader; text shaping needs the fonts feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
miniz_oxide = "0.9"
crc32fast = "1.5"
localpaint-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
localpaint-psd = { workspace = true, features = ["testgen"] }
localpaint-raw = { workspace = true, features = ["testgen"] }
localpaint-testkit = { workspace = true }
proptest = { workspace = true }
# Lossless JPEG XL encoder for the JPEG XL DNG preview test (tests only), as in localpaint-raw.
zune-jpegxl = { version = "=0.5.2", default-features = false, features = ["std"] }
zune-core = { workspace = true }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
