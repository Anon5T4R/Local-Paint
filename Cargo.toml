[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["libs"]
default-members = ["crates/*", "apps/localpaint", "apps/localpaint-cli", "xtask"]

[workspace.package]
version = "0.20.23"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
# Nada da suíte vai ao crates.io: dependência `path` sem versão numa crate publicável reprova o
# `cargo-deny` (wildcards). Cada membro herda com `publish.workspace = true`.
publish = false
repository = "https://github.com/Anon5T4R/Local-Paint"

[workspace.dependencies]
craft-ui = { path = "libs/craft-libs/crates/ui/", features = ["serde"] }
# internal
localpaint-geom = { path = "crates/geom" }
localpaint-color = { path = "crates/color" }
localpaint-cms = { path = "crates/cms" }
localpaint-raster = { path = "crates/raster" }
localpaint-doc = { path = "crates/doc" }
localpaint-ops = { path = "crates/ops" }
localpaint-psd = { path = "crates/psd" }
localpaint-codecs = { path = "crates/codecs" }
localpaint-raw = { path = "crates/raw" }
localpaint-affinity = { path = "crates/affinity" }
localpaint-compose = { path = "crates/compose" }
localpaint-gpu = { path = "crates/gpu" }
localpaint-paint = { path = "crates/paint" }
localpaint-algo = { path = "crates/algo" }
localpaint-io = { path = "crates/io" }
localpaint-text = { path = "crates/text" }
localpaint-vector = { path = "crates/vector" }
localpaint-format = { path = "crates/format" }
localpaint-automation = { path = "crates/automation" }
localpaint-plugins = { path = "crates/plugins" }
localpaint-engine = { path = "crates/engine" }
localpaint-ui-egui = { path = "crates/ui-egui" }
localpaint-testkit = { path = "crates/testkit" }
localpaint-tablet = { path = "crates/tablet" }
localpaint-ipp = { path = "crates/ipp" }

# external
craft-print = { path = "libs/craft-libs/crates/print/" }
craft-docpath = { version = "0.1.0", path = "libs/craft-libs/crates/docpath/" }
craft-jpeg = { path = "libs/craft-libs/crates/jpeg/" }
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { version = "=0.1.0", path = "libs/craft-libs/crates/update/", features = ["egui", "icons"] }
# Linux: the desktop's light/dark choice reaches `ctx.system_theme()` (winit reports none there);
# source of truth in local-libs, vendored here and replicated by its sync.ps1.
craft-desktop-theme = { path = "libs/craft-libs/crates/desktop-theme/" }
# The suite's icons for shared concepts (theme, settings, help, search…) and the theme button; the command
# palette. Source of truth in local-libs, vendored here and replicated by its sync.ps1.
craft-icons = { path = "libs/craft-libs/crates/icons/", features = ["egui"] }
craft-palette = { path = "libs/craft-libs/crates/palette/" }
# Shared MCP plumbing of the suite (stdio server skeleton, script/batch steps and the automation
# root flags); source of truth in local-libs, vendored here and replicated by its sync.ps1.
craft-mcp = { path = "libs/craft-libs/crates/mcp/" }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = { version = "0.3.3", features = ["env"] }
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
# `pure` keeps blake3 in Rust: its C/asm sources are never compiled nor linked.
# `std` only adds the std impls (constant_time_eq/std); it does not bring `cc` back.
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
image = { version = "0.25", default-features = false }
# Baseline-JPEG decode of lossy DNG tiles (compression 34892), shared with zune-jpeg.
zune-core = "0.5"
zune-jpeg = "0.5"
proptest = "1"
eframe = { version = "0.37", default-features = false }
# Without `default_fonts`, which embeds egui's fonts uncompressed: ui-egui ships them deflated
# (egui_fonts.rs).
egui = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
rustc-hash = "2.1.3"
criterion = { version = "0.8", default-features = false }
getrandom = "0.3"
# Monotonic clock for screenshot deadlines (a wall clock can jump).
web-time = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

# Dependencies carry no debug info: their frames in a backtrace lose file:line, and the target dir
# and link times shrink. The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
# Line tables keep file:line in panic backtraces but drop variable info, which roughly halves link
# time and PDB size for the test binaries (#2204). CI's Windows legs build with no debuginfo at all
# (CARGO_PROFILE_DEV_DEBUG=0). To inspect locals in a debugger, build with
# CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# Test builds compile ui-egui without optimization: its library and unit tests were the biggest
# test-build units after engine's (12.6 of ~63 compile minutes on the Windows CI runner), and its
# tests run no heavier pixel code of their own (that lives in the crates that stay optimized).
# Measured on CI: Windows build 18.9 -> 15.4 min, test run 10.0 -> 10.5. `cargo run` and
# `cargo build` use the dev profile and are unaffected.
[profile.test.package.localpaint-ui-egui]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1

# The egui and winit crates resolve from the vendored forks under libs/ (path sources;
# egui 6d518fc799681571963842f95b55a6b68431b15a, winit a517b3846ee8457d84ee4975110bfda6797c44dc).
[patch.crates-io]
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
# // local-paint: fork do rustls-rustcrypto (experimento TLS puro do updater).
# O upstream 0.0.2-alpha puxa rustls-webpki 0.102 só pelas constantes `alg_id`;
# o fork usa `rustls-pki-types` e some com os advisories (README no próprio fork).
rustls-rustcrypto = { path = "libs/rustls-rustcrypto" }
