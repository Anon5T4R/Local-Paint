# cargo-deny: a política de dependências da suíte (o CI roda `cargo deny check bans licenses sources
# advisories`; local: `cargo xtask ci`). Só licenças permissivas no código: copyleft (GPL, AGPL, LGPL)
# nunca é linkado — ferramenta assim só roda como processo externo.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

# As fontes padrão do egui (Ubuntu-Light, Hack, emoji-icon-font): licenças de fonte permitidas,
# atribuídas em assets/ATTRIBUTION.md como assets que vêm com a dependência.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# A lista de CAs que o rustls-platform-verifier traz no Linux é dado CDLA-Permissive-2.0 (permissiva).
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# IJG (a licença do libjpeg) é permissiva, no estilo BSD com atribuição; jpeg-encoder é a codificação JPEG
# em Rust puro do app, sem código copyleft.
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

# NCSA (University of Illinois/NCSA) é permissiva, no estilo BSD/MIT; libfuzzer-sys vem de dependência
# transitiva do rav1e (AVIF) e não roda em produção.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Nenhuma dependência git: tudo vem do crates.io (pinado pelo lock) ou de libs/ (vendored, path).
allow-git = []

[advisories]
yanked = "warn"
# Cada exceção diz por que não atinge o app. Sem motivo concreto, não entra.
ignore = [
    # TLS 100% Rust do craft-update (fork vendored do rustls-rustcrypto): só VERIFICA assinatura do
    # servidor com chave pública; não decifra, não assina, não opera chave privada.
    { id = "RUSTSEC-2023-0071", reason = "rsa sem patch (Marvin); o cliente só verifica com chave pública" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint/elliptic-curve via rustls-rustcrypto; sem operação com chave privada" },
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; sem vulnerabilidade, vem do código do app, não do craft-update (jiff)" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; proc macro só em tempo de compilação" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; pilha D-Bus do Linux (portal/acessibilidade)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; pilha D-Bus do Linux (portal/acessibilidade)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; pilha D-Bus do Linux (portal/acessibilidade)" },
    # rmcp: o app só usa o servidor MCP por stdio (features server/macros/transport-io); o cliente OAuth e o
    # cliente HTTP streamable das duas falhas não são compilados. Subir de 3.6 a 3.11 traz sha2/digest 0.11 e
    # vira decisão de dependência separada.
    { id = "RUSTSEC-2026-0457", reason = "rmcp: sem feature de cliente OAuth/HTTP (só server + transport-io)" },
    { id = "RUSTSEC-2026-0462", reason = "rmcp: sem cliente HTTP streamable (só server + transport-io)" },
    { id = "RUSTSEC-2026-0486", reason = "rustix 1.1.5 fixado pelas libs vendored; as funções xattr nunca são chamadas" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; proc macro só em tempo de compilação" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained (shaping do texto); sem vulnerabilidade, só abandono, sem substituto no fork do egui" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained (texto); sem versão segura e sem vulnerabilidade, só abandono" },
]
